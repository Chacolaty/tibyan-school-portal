
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration | Tibyan Wattahfizul Qur'an</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .register-section {
      min-height: 90vh;
      background: #f5f7f5;
      padding: 45px 18px;
      display: grid;
      place-items: center;
    }

    .register-card {
      width: 100%;
      max-width: 600px;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .register-card h1 { margin-bottom: 10px; }

    .register-card label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 600;
    }

    .register-card input,
    .register-card select,
    .register-card textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font: inherit;
    }

    .register-card button {
      width: 100%;
      border: 0;
      margin-top: 24px;
      cursor: pointer;
    }

    .register-card button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<header class="site-header">
  <a class="brand" href="index.html">
    <span class="brand-mark">ت</span>
    <span>
      <strong>TIBYAN WATTAHFIZUL QUR'AN</strong>
      <small>Student Registration</small>
    </span>
  </a>
</header>

<main class="register-section">
  <section class="register-card">
    <span class="kicker">JOIN OUR SCHOOL</span>
    <h1>Student Registration</h1>
    <p>Create your student portal account.</p>

    <form id="registerForm">

      <label for="fullName">Full Name</label>
      <input id="fullName" type="text" required>

      <label for="email">Email Address</label>
      <input id="email" type="email" required>

      <label for="phone">Phone Number</label>
      <input id="phone" type="tel" required>

      <label for="address">Home Address</label>
      <textarea id="address" rows="3" required></textarea>

      <label for="studentClass">Select Class</label>
      <select id="studentClass" required>
        <option value="">Loading classes...</option>
      </select>

      <label for="password">Create Password</label>
      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        required
      >

      <button class="button button-dark" id="registerButton" type="submit">
        Create Student Account
      </button>
    </form>

    <p id="message" role="status"></p>

    <p>Already registered?
      <a href="student-login.html">Student Login</a>
    </p>

    <a href="index.html">← Back to Homepage</a>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
const db = window.supabaseClient;

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const classSelect = document.getElementById("studentClass");
const registerButton = document.getElementById("registerButton");

// Check Supabase connection
if (!db) {
  message.style.color = "red";
  message.textContent =
    "Supabase connection failed. Please contact the administrator.";
  classSelect.innerHTML =
    '<option value="">Connection unavailable</option>';
}

// Load actual class IDs from Supabase
async function loadClasses() {
  try {
    const { data, error } = await db
      .from("classes")
      .select("id, name")
      .order("name");

    if (error) throw error;

    classSelect.innerHTML =
      '<option value="">Choose your class</option>';

    data.forEach(item => {
      const option = document.createElement("option");
      option.value = item.id;
      option.textContent = item.name;
      classSelect.appendChild(option);
    });

    if (!data.length) {
      classSelect.innerHTML =
        '<option value="">No classes available</option>';
    }

  } catch (error) {
    classSelect.innerHTML =
      '<option value="">Unable to load classes</option>';

    message.style.color = "red";
    message.textContent =
      "Could not load classes: " + error.message;
  }
}

if (db) {
  loadClasses();
}

// Register student
form.addEventListener("submit", async event => {
  event.preventDefault();

  const fullName =
    document.getElementById("fullName").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const address =
    document.getElementById("address").value.trim();

  const classId = classSelect.value;

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    message.style.color = "red";
    message.textContent = "Passwords do not match.";
    return;
  }

  if (!classId) {
    message.style.color = "red";
    message.textContent = "Please select a valid class.";
    return;
  }

  registerButton.disabled = true;
  registerButton.textContent = "Creating account...";

  message.style.color = "#333";
  message.textContent =
    "Please wait while your account is created...";

  try {
    const { data, error } = await db.auth.signUp({
      email,
      password,
      options: {
        data: {
          full_name: fullName,
          phone: phone,
          address: address,
          class_id: classId
        },
        emailRedirectTo:
          "https://chacolaty.github.io/tibyan-school-portal/student-login.html"
      }
    });

    if (error) throw error;

    if (!data.user) {
      throw new Error(
        "Account creation could not be confirmed."
      );
    }

    message.style.color = "green";
    message.textContent =
      "Registration submitted successfully! " +
      "Please check your email and confirm your email address. " +
      "Your account is awaiting administrator approval.";

    form.reset();

  } catch (error) {
    message.style.color = "red";
    message.textContent = error.message;

  } finally {
    registerButton.disabled = false;
    registerButton.textContent = "Create Student Account";
  }
});
</script>

</body>
</html>
